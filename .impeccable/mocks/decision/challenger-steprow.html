<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@500;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#24262a;color:#f2f2ee;font-family:'Chivo Mono',monospace}
nav{display:flex;justify-content:space-between;padding:18px 20px;font-size:13px;letter-spacing:.06em}
.lcd{margin:40px auto 0;width:200px;text-align:center;background:#120607;color:#ff3b2f;font-weight:800;font-size:54px;padding:6px;border-radius:6px;text-shadow:0 0 12px #ff3b2f}
.lcdl{text-align:center;font-size:12px;margin-top:6px;opacity:.7}
h1{text-align:center;font-weight:800;font-size:40px;margin-top:38px;line-height:1}
.row{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;padding:0 20px;margin-top:40px}
.s{height:58px;border-radius:5px;position:relative}
.s::after{content:'';position:absolute;top:6px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#000a}
.s.on::after{background:#ff3b2f;box-shadow:0 0 10px #ff3b2f}
.r{background:#d8392b}.o{background:#ef7d22}.y{background:#f2c230}.w{background:#ecebe4}
.chase{outline:3px solid #fff;outline-offset:2px}
.cap{display:flex;justify-content:space-between;padding:0 20px;margin-top:10px;font-size:11px;opacity:.7}
.go{display:flex;gap:10px;justify-content:center;margin-top:44px}
.go span{padding:14px 16px;background:#3a3d42;border-radius:6px;font-size:14px;font-weight:800}
.go .p{background:#ff3b2f}
</style></head><body>
<nav><span>ALDMF · PATTERN 01</span><span>ID/EN</span></nav>
<div class="lcd">090</div><div class="lcdl">BPM · APP + BEAT</div>
<h1>Aldi Fahri</h1>
<div class="row">
<div class="s r on"></div><div class="s r"></div><div class="s r on chase"></div><div class="s r"></div>
<div class="s o"></div><div class="s o on"></div><div class="s o"></div><div class="s o"></div>
<div class="s y on"></div><div class="s y"></div><div class="s y"></div><div class="s y on"></div>
<div class="s w"></div><div class="s w on"></div><div class="s w"></div><div class="s w"></div></div>
<div class="cap"><span>1–4 BEAT</span><span>5–12 APP</span><span>13–16 KONTAK</span></div>
<div class="go"><span class="p">RUN ▶</span><span>BEAT</span><span>APP</span><span>WA</span></div>
</body></html>
