<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500&display=swap" rel="stylesheet">
<style>
:root{--ink:#121212;--mag:#e5267a;--cyan:#19b3d6;--kuning:#ffd23f;--putih:#f4f4f0}
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:var(--ink);color:var(--putih);font-family:Archivo,sans-serif}
nav{display:flex;justify-content:space-between;padding:18px 20px;font-size:15px}
.tape{width:330px;height:210px;margin:56px auto 0;background:var(--mag);border-radius:14px;position:relative;transform:rotate(-4deg);box-shadow:0 30px 60px #0008}
.label{position:absolute;left:18px;right:18px;top:16px;height:92px;background:var(--putih);color:var(--ink);border-radius:6px;padding:10px 12px}
.label b{font-family:'Archivo Black';font-size:34px;line-height:1;display:block}
.label span{font-size:13px}
.win{position:absolute;left:70px;right:70px;bottom:26px;height:56px;background:#0006;border-radius:28px;display:flex;justify-content:space-between;align-items:center;padding:0 12px}
.reel{width:40px;height:40px;border-radius:50%;border:6px dotted var(--putih)}
.side{display:flex;justify-content:center;gap:0;margin-top:46px}
.side span{padding:12px 22px;border:2px solid var(--putih);font-family:'Archivo Black';font-size:16px}
.side .on{background:var(--kuning);color:var(--ink);border-color:var(--kuning)}
.keys{display:flex;justify-content:center;gap:4px;margin-top:34px}
.k{width:30px;height:110px;background:var(--putih);border-radius:0 0 6px 6px}.k.b{background:#000;width:20px;height:70px;margin:0 -12px;z-index:2}
.k.on{background:var(--cyan)}
.cta{display:block;width:330px;margin:34px auto 0;text-align:center;padding:16px;background:var(--kuning);color:var(--ink);font-family:'Archivo Black';font-size:18px}
</style></head><body>
<nav><b>aldmf records</b><span>ID / EN</span></nav>
<div class="tape"><div class="label"><b>ALDI FAHRI</b><span>Side A: beat · Side B: aplikasi · Banjarmasin 2026</span></div><div class="win"><div class="reel"></div><div class="reel"></div></div></div>
<div class="side"><span class="on">Side A · Beat</span><span>Side B · App</span></div>
<div class="keys"><div class="k"></div><div class="k b"></div><div class="k"></div><div class="k b"></div><div class="k on"></div><div class="k"></div><div class="k b"></div><div class="k"></div><div class="k b"></div><div class="k"></div><div class="k b"></div><div class="k"></div></div>
<span class="cta">Putar rilisan terbaru ▶</span>
</body></html>
