<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--mal:#3f7a64;--cin:#c2412e;--bone:#efe9dc;--line:#1d2a24}
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:var(--mal);color:var(--bone);font-family:Figtree,sans-serif;perspective:700px}
nav{display:flex;justify-content:space-between;padding:18px 20px;font-size:15px;font-weight:700}
h1{text-align:center;font-family:Gloock,serif;font-size:58px;line-height:.95;margin-top:26px}
.sub{text-align:center;margin-top:10px;font-size:16px}
.cab{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:30px 18px 0;border:3px solid var(--line);background:var(--bone)}
.box{height:150px;border:3px solid var(--line);position:relative;overflow:hidden;background:linear-gradient(#e2d8c2,#efe9dc)}
/* reverse perspective: back wider than front */
.box::before{content:'';position:absolute;left:-14px;right:-14px;top:14px;bottom:14px;border:2px solid var(--line);background:#d9cdb3}
.box i{position:absolute;left:22px;right:22px;bottom:26px;height:70px;background:var(--cin);border:2px solid var(--line)}
.box.app i{background:#fff;border-radius:4px}
.box.wide{grid-column:1/3;height:170px}
.keys{position:absolute;left:30px;right:30px;bottom:24px;display:flex;gap:3px}
.keys b{flex:1;height:70px;background:#fff;border:2px solid var(--line)}
.lbl{position:absolute;top:20px;left:24px;color:var(--line);font-weight:700;font-size:14px}
</style></head><body>
<nav><span>aldmf</span><span>ID / EN</span></nav>
<h1>Lemari<br>Aldi</h1>
<p class="sub">Aplikasi dan beat, satu lemari.</p>
<div class="cab">
<div class="box wide"><span class="lbl">MIDI · tekan</span><div class="keys"><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></div></div>
<div class="box app"><span class="lbl">Kasir OK</span><i></i></div>
<div class="box"><span class="lbl">Beat 01</span><i></i></div>
</div>
</body></html>
